name: Build

on:
  push:
    branches:
      - version/1.7.10
  pull_request:
    branches:
      - version/1.7.10
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-1.7.10-${{ hashFiles('build.gradle', 'forge/build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        run: ./gradlew setupCIWorkspace build --max-workers=2

      - name: Check the jars
        run: |
          for KIND in dev prod sources; do
            JAR=$(ls forge/build/libs/joid-backend-minecraft-forge-*-"$KIND".jar 2>/dev/null | head -n 1)
            if [ -z "$JAR" ]; then
              echo "::error::The $KIND jar is missing"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: jars
          path: |
            forge/build/libs/*-dev.jar
            forge/build/libs/*-prod.jar
            forge/build/libs/*-sources.jar

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: reports
          path: forge/build/reports/

  client-smoke-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-1.7.10-client-${{ hashFiles('build.gradle', 'forge/build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install Xvfb, Mesa and xdotool
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils x11-xserver-utils libxrandr2 libxxf86vm1 libxcursor1 libxi6 xdotool

      - name: Set up the dev workspace
        run: ./gradlew setupDevWorkspace --max-workers=2

      - name: Client smoke test
        timeout-minutes: 25
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          mkdir -p forge/runs
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :forge:runClient -Pjoid.smoke --max-workers=2 2>&1 | tee forge/runs/smoke.log
          if ! grep -q "\[JOID\] Client smoke test passed" forge/runs/smoke.log; then
            echo "::error::The client smoke test did not pass"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: client-smoke-tests
          path: |
            forge/runs/smoke.log
            forge/runs/client/screenshots/
            forge/runs/client/logs/
            forge/runs/client/crash-reports/
