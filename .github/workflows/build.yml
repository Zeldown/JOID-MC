name: Build

on:
  push:
    branches:
      - version/1.7.10
  pull_request:
    branches:
      - version/1.7.10
  workflow_dispatch:
    inputs:
      showcase:
        description: The showcase scenes to render, comma separated
        type: string
        default: ''

jobs:
  version:
    uses: Zeldown/JOID-MC/.github/workflows/version.yml@common
    with:
      java-version: '8'
      loaders: '["forge"]'
      vulkan: false
      setup-tasks: setupCIWorkspace
      client-setup-tasks: setupDevWorkspace
      gradle-args: --max-workers=2
      showcase: ${{ inputs.showcase || '' }}
