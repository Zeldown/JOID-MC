name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Check the jars
        run: |
          for LOADER in fabric neoforge forge; do
            for KIND in dev prod; do
              JAR=$(ls "$LOADER"/build/libs/joid-backend-minecraft-"$LOADER"-*-"$KIND".jar 2>/dev/null | head -n 1)
              if [ -z "$JAR" ]; then
                echo "::error::The $KIND jar of $LOADER is missing"
                exit 1
              fi
            done
          done

      - uses: actions/upload-artifact@v6
        with:
          name: jars
          path: |
            */build/libs/*-dev.jar
            */build/libs/*-prod.jar

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: reports
          path: '*/build/reports/'

  client-tests:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Client game tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric:runClientGameTest

      - name: Report the snapshot renderer
        if: always()
        run: |
          RECORDED=$(git status --porcelain --untracked-files=all .snapshots/references/opengl | wc -l)
          echo "::notice::OpenGL snapshot renderers: $(ls .snapshots/references/opengl | xargs), $RECORDED references recorded by this run"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: client-tests
          path: |
            fabric/build/run/clientGameTest/screenshots/
            fabric/build/run/clientGameTest/logs/
            fabric/build/snapshots/
            .snapshots/references/opengl/

  client-tests-vulkan:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Xvfb and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 vulkan-tools

      - name: Report the Vulkan device
        run: vulkaninfo --summary | grep -E "deviceName|driverName|driverInfo" || true

      - name: Client game tests
        env:
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric:runClientGameTest -Pjoid.graphicsBackend=vulkan

      - name: Check the graphics backend
        run: |
          if ! grep -q "Using graphics backend Vulkan" fabric/build/run/clientGameTest/logs/latest.log; then
            echo "::error::Minecraft did not run on Vulkan: $(grep -m 1 'Using graphics backend' fabric/build/run/clientGameTest/logs/latest.log)"
            exit 1
          fi

      - name: Report the snapshot renderer
        if: always()
        run: |
          RECORDED=$(git status --porcelain --untracked-files=all .snapshots/references/vulkan | wc -l)
          echo "::notice::Vulkan snapshot renderers: $(ls .snapshots/references/vulkan | xargs), $RECORDED references recorded by this run"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: client-tests-vulkan
          path: |
            fabric/build/run/clientGameTest/screenshots/
            fabric/build/run/clientGameTest/logs/
            fabric/build/snapshots/
            .snapshots/references/vulkan/

  client-smoke-tests:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        loader: [neoforge, forge]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Client smoke test
        env:
          LOADER: ${{ matrix.loader }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew ":$LOADER:runClient" -Pjoid.smoke

      - name: Check the smoke test result
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          if ! grep -q "Client smoke test passed" "$LOADER"/runs/client/logs/latest.log; then
            echo "::error::The client smoke test of $LOADER did not pass"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: client-smoke-tests-${{ matrix.loader }}
          path: |
            ${{ matrix.loader }}/runs/client/screenshots/
            ${{ matrix.loader }}/runs/client/logs/
            ${{ matrix.loader }}/runs/client/crash-reports/

  server-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Server game tests
        run: ./gradlew :neoforge:runGameTestServer :forge:runGameTestServer
