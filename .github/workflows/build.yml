name: Build

on:
  push:
    branches:
      - version/1.20.1
  pull_request:
    branches:
      - version/1.20.1
  workflow_dispatch:
    inputs:
      showcase:
        description: The showcase scenes to render, comma separated
        type: string
        default: ''

jobs:
  version:
    uses: Zeldown/JOID-MC/.github/workflows/version.yml@common
    with:
      java-version: '17'
      loaders: '["fabric", "neoforge", "forge"]'
      vulkan: false
      showcase: ${{ inputs.showcase || '' }}
