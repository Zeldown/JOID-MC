name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        env:
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_NAME" =~ ^v([0-9]+(\.[0-9]+)+)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::The release name must follow the v{mcversion}-X.X.X format, got '$RELEASE_NAME'"
            exit 1
          fi
          MC_VERSION="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[3]}"
          PROJECT_MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          if [[ "$MC_VERSION" != "$PROJECT_MC_VERSION" ]]; then
            echo "::error::The release targets Minecraft $MC_VERSION but the project is built for $PROJECT_MC_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: [fabric, neoforge, forge]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        env:
          LOADER: ${{ matrix.loader }}
          VERSION: ${{ needs.version.outputs.version }}
        run: ./gradlew ":$LOADER:build" --configure-on-demand -Pversion="$VERSION"

      - name: Upload the jar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          LOADER: ${{ matrix.loader }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "$TAG" "$LOADER"/build/libs/*-"$VERSION".jar --clobber
