plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    maven {
        name = 'Fabric'
        url = uri('https://maven.fabricmc.net')
    }
}

dependencies {
    implementation('com.gradleup.shadow:shadow-gradle-plugin:9.6.1')
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    implementation('fabric-loom:fabric-loom.gradle.plugin:1.17.21')
    // see https://plugins.gradle.org/plugin/net.minecraftforge.gradle for new versions
    implementation('net.minecraftforge.gradle:net.minecraftforge.gradle.gradle.plugin:7.0.40')
    // see https://plugins.gradle.org/plugin/net.minecraftforge.renamer for new versions
    implementation('net.minecraftforge.renamer:net.minecraftforge.renamer.gradle.plugin:1.1.8')
}