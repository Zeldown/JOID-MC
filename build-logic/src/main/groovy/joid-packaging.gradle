ext {
    developmentPatterns = [
            'assets/dev/**',
            'assets/demo/**',
            'dev/joid/demo/**',
            'dev/joid/internal/font/**',
            'dev/joid/lib/ui/node/impl/dev/**',
            'dev/joid/base/glfw/demo/**',
            'dev/joid/base/glfw/snapshot/**',
            'dev/joid/backend/minecraft/**/demo/**',
            'dev/joid/backend/minecraft/snapshot/**',
            'assets/joid/demo/**',
            'data/joid/**/demo/**'
    ]

    developmentReferences = ~/dev\/joid\/(demo|backend\/minecraft\/([\w$]+\/)*(demo|snapshot))\/[\w$\/]+/

    developmentCallSites = [
            'dev/joid/backend/minecraft/MinecraftBackend.class -> dev/joid/backend/minecraft/demo/DemoLauncher'
    ]

    moduleDescriptors = [
            'module-info.class',
            'META-INF/versions/*/module-info.class'
    ]

    excludeDevelopment = { task ->
        task.exclude(developmentPatterns)
    }
}
