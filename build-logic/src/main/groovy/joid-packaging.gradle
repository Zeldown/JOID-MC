ext {
    developmentPatterns = [
            'assets/dev/**',
            'assets/demo/**',
            'dev/joid/demo/**',
            'dev/joid/internal/font/**',
            'dev/joid/lib/ui/node/impl/dev/**',
            'dev/joid/base/glfw/demo/**',
            'dev/joid/base/glfw/snapshot/**',
            'dev/joid/backend/minecraft/**/demo/**',
            'dev/joid/backend/minecraft/bridge/snapshot/**',
            'assets/joid/demo/**',
            'assets/joid/lang/**',
            'data/joid/**/demo/**'
    ]

    developmentReferences = ~/dev\/joid\/(demo|test|backend\/minecraft\/([\w$]+\/)*(demo|snapshot))\/[\w$\/]+/

    developmentWords = ['demo', 'demos', 'test', 'tests', 'gametest', 'gametests', 'snapshot', 'snapshots', 'testkit']

    developmentDeclarations = ~/dev\/joid\/backend\/minecraft\/(loader\/registry\/GameTestFunction|\w+\/registry\/\w+GameTests)(\$[\w$]+)?\.class/

    developmentCallSites = [
            'dev/joid/backend/minecraft/Backend.class -> dev/joid/backend/minecraft/demo/DemoLauncher'
    ]

    moduleDescriptors = [
            'module-info.class',
            'META-INF/versions/*/module-info.class'
    ]

    excludeDevelopment = { task ->
        task.exclude(developmentPatterns)
    }
}
