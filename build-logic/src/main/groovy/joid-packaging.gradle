ext {
    developmentPatterns = [
            'assets/dev/**',
            'assets/demo/**',
            'dev/joid/demo/**',
            'dev/joid/internal/font/**',
            'dev/joid/lib/ui/node/impl/dev/**',
            'dev/joid/impl/glfw/demo/**',
            'dev/joid/impl/minecraft/**/demo/**',
            'dev/joid/impl/minecraft/snapshot/**',
            'assets/joid/demo/**'
    ]

    developmentReferences = ~/dev\/joid\/(demo|impl\/minecraft\/([\w$]+\/)*(demo|snapshot))\/[\w$\/]+/

    developmentCallSites = [
            'dev/joid/impl/minecraft/JoidMinecraft.class -> dev/joid/impl/minecraft/demo/DemoLauncher'
    ]

    moduleDescriptors = [
            'module-info.class',
            'META-INF/versions/*/module-info.class'
    ]

    excludeDevelopment = { task ->
        task.exclude(developmentPatterns)
    }
}
