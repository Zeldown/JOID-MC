plugins {
    id 'joid-java'
    id 'joid-packaging'
    id 'net.fabricmc.fabric-loom-remap'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    compileOnly(files(rootProject.file("libs/joid-core-${joid_version}-demo.jar")))
    compileOnly(files(rootProject.file("libs/joid-backend-minecraft-common-${common_version}-demo.jar")))
    compileOnly(files(rootProject.file("libs/joid-base-opengl-${joid_version}.jar")))
    compileOnly(files(rootProject.file("libs/joid-base-opengl-${joid_version}-snapshot.jar")))
    compileOnly(files(rootProject.file("libs/joid-base-lwjgl3-opengl-${joid_version}.jar")))
    compileOnly(files(rootProject.file("libs/joid-base-lwjgl3-opengl-${joid_version}-snapshot.jar")))
    compileOnly(files(rootProject.file("libs/joid-base-lwjgl3-glfw-${joid_version}.jar")))
    compileOnly(files(rootProject.file("libs/joid-base-lwjgl3-openal-${joid_version}.jar")))
    compileOnly(files(rootProject.file("libs/joid-base-openal-${joid_version}.jar")))
    compileOnly(files(rootProject.file("libs/joid-tool-testkit-${joid_version}.jar")))
    compileOnly("junit:junit:${junit_version}")
    compileOnly("javax.vecmath:vecmath:${vecmath_version}")

    testImplementation(files(rootProject.file("libs/joid-core-${joid_version}-demo.jar")))
    testImplementation(files(rootProject.file("libs/joid-backend-minecraft-common-${common_version}-dev.jar")))
    testImplementation(files(rootProject.file("libs/joid-tool-testkit-${joid_version}.jar")))
    testImplementation("junit:junit:${junit_version}")
    testRuntimeOnly("commons-io:commons-io:${commons_io_version}")
}

test {
    useJUnit()
    systemProperty('joid.data', layout.buildDirectory.dir('joid').get().asFile.absolutePath)
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst {
        workingDir.mkdirs()
    }
    testLogging {
        exceptionFormat = 'full'
        events('failed')
    }
}

[jar, sourcesJar, javadoc].each { task ->
    task.configure {
        excludeDemo(it)
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}