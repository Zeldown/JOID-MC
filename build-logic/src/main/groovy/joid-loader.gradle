import java.lang.reflect.InvocationTargetException
import java.util.regex.Pattern
import java.util.zip.ZipFile

import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.commons.ClassRemapper
import org.objectweb.asm.commons.Remapper

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

import groovy.json.JsonSlurper

plugins {
    id 'joid-java'
    id 'joid-packaging'
    id 'com.gradleup.shadow'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
    embed {
        transitive = false
    }
    joidDemo
    joidDev
    joidProd
    clientTest
    compileOnly.extendsFrom(embed, joidDemo, clientTest)
    runtimeOnly.extendsFrom(embed, joidDemo, clientTest)
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

dependencies {
    compileOnly(project(':common')) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
    joidDemo(files(rootProject.file("libs/joid-core-${joid_version}-demo.jar")))
    joidDev(files(rootProject.file("libs/joid-core-${joid_version}-dev.jar")))
    joidProd(files(rootProject.file("libs/joid-core-${joid_version}-prod.jar")))
    joidProd(files(rootProject.file("libs/joid-backend-minecraft-common-${common_version}-prod.jar")))
    compileOnly(files(rootProject.file("libs/joid-backend-minecraft-common-${common_version}-demo.jar")))
    clientTest(files(rootProject.file("libs/joid-tool-testkit-${joid_version}.jar")))
    clientTest(files(rootProject.file("libs/joid-base-opengl-${joid_version}-snapshot.jar")))
    clientTest(files(rootProject.file("libs/joid-base-lwjgl3-opengl-${joid_version}-snapshot.jar")))
    clientTest("junit:junit:${junit_version}")
    embed(files(rootProject.file("libs/joid-base-opengl-${joid_version}.jar")))
    embed(files(rootProject.file("libs/joid-base-lwjgl3-opengl-${joid_version}.jar")))
    embed(files(rootProject.file("libs/joid-base-lwjgl3-glfw-${joid_version}.jar")))
    embed(files(rootProject.file("libs/joid-base-lwjgl3-openal-${joid_version}.jar")))
    embed(files(rootProject.file("libs/joid-base-openal-${joid_version}.jar")))
    embed("javax.vecmath:vecmath:${vecmath_version}")
}

def loaderVariants = ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath', 'jarJar']
configurations.matching { it.name in loaderVariants }.configureEach {
    attributes {
        attribute(loaderAttribute, project.name)
    }
}
sourceSets.configureEach {
    def classpaths = [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName]
    configurations.matching { it.name in classpaths }.configureEach {
        attributes {
            attribute(loaderAttribute, project.name)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    from(zipTree(rootProject.file("libs/joid-backend-minecraft-common-${common_version}-demo.jar"))) {
        include('**/*.class')
    }
}

tasks.named('javadoc', Javadoc) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    excludeDemo(it)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava, configurations.commonResources)
    from(configurations.commonJava, configurations.commonResources)
    from(zipTree(rootProject.file("libs/joid-backend-minecraft-common-${common_version}-sources.jar"))) {
        exclude('META-INF/**')
    }
    excludeDemo(it)
}

jar {
    archiveClassifier = 'slim'
    excludeDemo(it)
}

shadowJar {
    enabled = false
}

def devJar = tasks.register('devJar', ShadowJar) {
    group = 'build'
    description = 'Builds the dev jar of the mod, with the dev mode of JOID and no demo.'
    archiveClassifier = 'dev'
    from(sourceSets.main.output)
    configurations = [project.configurations.embed, project.configurations.joidDev]
    exclude(moduleDescriptors)
    excludeDemo(it)
    manifest.inheritFrom(jar.manifest)
}

def prodJar = tasks.register('prodJar', ShadowJar) {
    group = 'build'
    description = 'Builds the prod jar of the mod, without any code or asset of the dev and demo modes.'
    archiveClassifier = 'prod'
    from(sourceSets.main.output.classesDirs)
    from(tasks.named('processResources')) {
        exclude('**/*.class')
    }
    configurations = [project.configurations.embed, project.configurations.joidProd]
    exclude(moduleDescriptors)
    excludeDevelopment(it)
    manifest.inheritFrom(jar.manifest)
}

def loaderName = project.name

def shipped = { String name ->
    tasks.named(plugins.hasPlugin('net.fabricmc.fabric-loom-remap') ? "remap${name.capitalize()}" : "reobf${name.capitalize()}")
}

ext.joidClient = { run ->
    if (project.hasProperty('joid.test')) {
        run.systemProperty('joid.test', 'true')
        run.systemProperty('joid.loader', project.name)
        run.systemProperty('joid.snapshot.output', file('runs/snapshots').absolutePath)
        run.systemProperty('joid.snapshot.references', rootProject.file('.snapshots/references').absolutePath)
        run.systemProperty('joid.cache', layout.buildDirectory.dir('joid-cache').get().asFile.absolutePath)
        run.programArguments.addAll('--width', '1920', '--height', '1080')
    }
    if (project.hasProperty('joid.showcase')) {
        project.properties.findAll { it.key.startsWith('joid.showcase') }.each { run.systemProperty(it.key, it.value.toString()) }
        run.programArguments.addAll('--width', '1920', '--height', '1080', '--username', 'JOID')
    }
}

configurations.matching { it.name == 'additionalRuntimeClasspath' }.configureEach {
    extendsFrom(configurations.embed, configurations.joidDemo, configurations.clientTest)
}

if (project.hasProperty('joid.test') || project.hasProperty('joid.showcase')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def config = file('runs/client/config/fml.toml')
            config.parentFile.mkdirs()
            config.text = 'splashscreen = true
maxThreads = -1
versionCheck = true
defaultConfigPath = "defaultconfigs"
'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def verifyJar = { String kind, File archive, File common, List<String> patterns, Pattern references, List<String> words, boolean devMode ->
    def absent = [] as SortedSet
    new ZipFile(common).withCloseable { source ->
        new ZipFile(archive).withCloseable { zip ->
            source.entries().findAll { it.name.endsWith('.class') && zip.getEntry(it.name) == null }.each { absent << it.name }
        }
    }
    if (!absent.isEmpty()) {
        throw new GradleException("The ${kind} jar misses classes of ${common.name}: ${absent.take(10)}")
    }

    def found = []
    zipTree(archive).matching { include(patterns) }.visit { if (!it.directory) found << it.relativePath.pathString }
    if (!found.isEmpty()) {
        throw new GradleException("The ${kind} jar holds entries it must not ship: ${found.take(10)}")
    }

    def referencing = [] as SortedSet
    new ZipFile(archive).withCloseable { zip ->
        zip.entries().findAll { it.name.startsWith('dev/joid/backend/minecraft/') && it.name.endsWith('.class') }.each { entry ->
            def text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
            def matcher = references.matcher(text)
            while (matcher.find()) {
                def reference = "${entry.name} -> ${matcher.group()}".toString()
                if (!demoCallSites.contains(reference)) {
                    referencing << reference
                }
            }
        }
    }
    if (!referencing.isEmpty()) {
        throw new GradleException("The ${kind} jar references classes it does not ship: ${referencing.take(10)}")
    }

    def missing = [] as SortedSet
    if (!devMode) {
        new ZipFile(archive).withCloseable { zip ->
            zip.entries().findAll { it.name.startsWith('dev/joid/backend/minecraft/') && it.name.endsWith('.class') }.each { entry ->
                def names = [] as Set
                def remapper = new Remapper() {
                    @Override
                    String map(final String internalName) {
                        names << internalName
                        return internalName
                    }
                }
                new ClassReader(zip.getInputStream(entry).bytes).accept(new ClassRemapper(new ClassWriter(0), remapper), 0)
                names.findAll { it.startsWith('dev/joid/') && zip.getEntry("${it}.class") == null }.each { name ->
                    def reference = "${entry.name} -> ${name}".toString()
                    if (!demoCallSites.contains(reference)) {
                        missing << reference
                    }
                }
            }
        }
    }
    if (!missing.isEmpty()) {
        throw new GradleException("[JOID] The ${kind} jar links classes of JOID it does not ship, which throws NoClassDefFoundError at run time: ${missing.take(10)}")
    }

    def named = [] as SortedSet
    def translated = [] as SortedSet
    def described = [] as SortedSet
    def split = { String text -> text.split(/[^A-Za-z0-9]+|(?<=[a-z0-9])(?=[A-Z])/)*.toLowerCase() }
    new ZipFile(archive).withCloseable { zip ->
        zip.entries().findAll { !it.directory }.each { entry ->
            if (!entry.name.startsWith('dev/joid/shaded/') && split(entry.name).any { it in words }) {
                named << entry.name
            }

            if (entry.name ==~ /assets\/[^\/]+\/lang\/[^\/]+\.json/) {
                new JsonSlurper().parse(zip.getInputStream(entry)).keySet().findAll { key -> split(key).any { it in words } }.each { key -> translated << "${entry.name} -> ${key}".toString() }
            }

            if (entry.name ==~ /[^\/]+\.(json|mcmeta|cfg|classtweaker)|META-INF\/[^\/]+\.(toml|cfg)|(assets|data)\/.+\.(json|mcmeta)/) {
                def lines = new String(zip.getInputStream(entry).bytes, 'UTF-8').readLines().collect { it.replaceAll(/#.*/, '').replaceAll(/^displayTest = .*/, '') }
                if (lines.any { line -> split(line).any { it in words } }) {
                    described << entry.name
                }
            }
        }
    }
    if (!named.isEmpty()) {
        throw new GradleException("The ${kind} jar holds entries named after ${words}: ${named.take(10)}")
    }

    if (!translated.isEmpty()) {
        throw new GradleException("The ${kind} jar holds translations named after ${words}: ${translated.take(10)}")
    }

    if (!described.isEmpty()) {
        throw new GradleException("The ${kind} jar declares content named after ${words} in: ${described.take(10)}")
    }

    def server = [] as SortedSet
    new ZipFile(archive).withCloseable { zip ->
        if (loaderName == 'fabric' && new JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json'))).environment != 'client') {
            server << 'fabric.mod.json'
        }

        def mod = zip.getEntry('dev/joid/backend/minecraft/forge/ForgeJoid.class')
        if (loaderName != 'fabric' && (mod == null || !new String(zip.getInputStream(mod).bytes, 'ISO-8859-1').contains('IExtensionPoint\$DisplayTest'))) {
            server << 'dev/joid/backend/minecraft/forge/ForgeJoid.class'
        }
    }
    if (!server.isEmpty()) {
        throw new GradleException("The ${kind} jar is not declared client only in: ${server}")
    }

    def loader = new URLClassLoader([archive.toURI().toURL()] as URL[], ClassLoader.platformClassLoader)
    try {
        def environment = loader.loadClass('dev.joid.lib.JOIDEnv')
        if (environment.getMethod('isDevMode').invoke(null) != devMode) {
            throw new GradleException("The ${kind} jar starts JOID with the dev mode ${devMode ? 'off' : 'on'}")
        }

        if (environment.getMethod('isDemoMode').invoke(null)) {
            throw new GradleException("The ${kind} jar starts JOID with the demo mode on")
        }

        if (!devMode) {
            try {
                environment.getMethod('devMode', Boolean.TYPE).invoke(null, true)
                throw new GradleException("The ${kind} jar accepts JOIDEnv.devMode(true)")
            } catch (final InvocationTargetException e) {
                if (!(e.cause instanceof IllegalStateException)) {
                    throw e
                }
            }
        }
    } finally {
        loader.close()
    }
}

def verifyProdJar = tasks.register('verifyProdJar') {
    group = 'verification'
    description = 'Checks that the prod jar holds no code, asset or reference of the dev and demo modes.'
    def archive = shipped('prodJar').flatMap { it.archiveFile }
    def common = rootProject.file("libs/joid-backend-minecraft-common-${common_version}-prod.jar")
    def patterns = demoPatterns + devPatterns
    def references = developmentReferences
    def words = developmentWords
    inputs.file(archive)
    inputs.file(common)
    doLast {
        verifyJar('prod', archive.get().asFile, common, patterns, references, words, false)
    }
}

def verifyDevJar = tasks.register('verifyDevJar') {
    group = 'verification'
    description = 'Checks that the dev jar starts JOID in dev mode and holds no code, asset or reference of the demos.'
    def archive = shipped('devJar').flatMap { it.archiveFile }
    def common = rootProject.file("libs/joid-backend-minecraft-common-${common_version}-dev.jar")
    def patterns = demoPatterns
    def references = demoReferences
    def words = demoWords
    inputs.file(archive)
    inputs.file(common)
    doLast {
        new ZipFile(archive.get().asFile).withCloseable { zip ->
            ['dev/joid/lib/ui/node/impl/dev/DevNode.class', 'dev/joid/internal/font/DevFont.class'].each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("The dev jar misses ${entry}")
                }
            }
        }
        verifyJar('dev', archive.get().asFile, common, patterns, references, words, true)
    }
}

assemble.dependsOn { [shipped('devJar'), shipped('prodJar')] }
check.dependsOn(verifyProdJar, verifyDevJar)