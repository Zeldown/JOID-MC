buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'Gradle Plugins'
            url = 'https://plugins.gradle.org/m2/'
        }
        maven {
            name = 'Paladium-Public'
            url = 'https://repository.palagitium.dev/artifactory/Paladium-Public'
        }
    }
    dependencies {
        classpath "fr.paladium.gradle:PalaForgeGradle:${forge_gradle_version}"
        classpath "com.github.jengelman.gradle.plugins:shadow:${shadow_version}"
    }
}