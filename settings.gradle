pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroupAndSubgroups('fabric-loom')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'eclipse' }) {
    System.setProperty('eclipse.application', 'gradle')
}

rootProject.name = 'JOID-MC'
includeBuild('build-logic')
include('common')
include('fabric')
include('forge')