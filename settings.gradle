pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'eclipse' }) {
    System.setProperty('eclipse.application', 'gradle')
}

rootProject.name = 'JOID-MC'
includeBuild('build-logic')
include('base')
include('common')
include('fabric')
include('neoforge')
include('forge')
