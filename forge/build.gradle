plugins {
    id 'joid-loader'
    id 'net.minecraftforge.gradle'
}

minecraft {
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = files(at)
    }
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir("runs/${it.name}")
            systemProperty('forge.enabledGameTestNamespaces', mod_id)
        }
        register('client')
        register('server') {
            args('--nogui')
        }
        register('data') {
            args('--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath)
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven(fg.forgeMaven)
    maven(fg.minecraftLibsMaven)
    mavenCentral()
}

dependencies {
    implementation(minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}"))
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
