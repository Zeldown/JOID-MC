modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/Zeldown/JOID-MC/issues"
clientSideOnly = true
[[mods]]
modId = "${mod_id}"
version = "${version}"
