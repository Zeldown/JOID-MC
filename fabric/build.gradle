import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'joid-loader'
}

apply plugin: 'net.fabricmc.fabric-loom-remap'

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

dependencies {
    compileOnly(project(':common')) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    minecraft("com.mojang:minecraft:${minecraft_version}")
    mappings(loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_version}@zip")
    })
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = uri('https://maven.parchmentmc.org')
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            if (project.hasProperty('joid.test')) {
                vmArg('-Djoid.test=true')
                vmArg("-Djoid.loader=${project.name}")
                vmArg("-Djoid.snapshot.output=${file('runs/snapshots').absolutePath}")
                vmArg("-Djoid.snapshot.references=${rootProject.file('.snapshots/references').absolutePath}")
                vmArg("-Djoid.cache=${layout.buildDirectory.dir('joid-cache').get().asFile.absolutePath}")
                programArgs('--width', '1920', '--height', '1080')
            }
            if (project.hasProperty('joid.showcase')) {
                project.properties.findAll { it.key.startsWith('joid.showcase') }.each { vmArg("-D${it.key}=${it.value}") }
                programArgs('--width', '1920', '--height', '1080', '--username', 'JOID')
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

['devJar', 'prodJar'].each { name ->
    def jar = tasks.named(name, Jar)
    jar.configure {
        destinationDirectory = layout.buildDirectory.dir('devlibs')
    }
    tasks.register("remap${name.capitalize()}", RemapJarTask) {
        group = 'build'
        description = "Remaps the ${name} to the intermediary names of Fabric."
        inputFile = jar.flatMap { it.archiveFile }
        archiveClassifier = jar.flatMap { it.archiveClassifier }
        addNestedDependencies = false
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    useXvfb = false
}

tasks.named('eclipseClasspath') {
    dependsOn('genSources')
}

tasks.named('genEclipseRuns') {
    doLast {
        fileTree(projectDir) { include('*.launch') }.each { launch ->
            launch.text = launch.text
                    .replace('${workspace_loc:' + eclipse.project.name + '}/' + project.name + '\\', '${workspace_loc:' + eclipse.project.name + '}/')
                    .replaceAll(/\s*<stringAttribute key="org\.eclipse\.jdt\.launching\.CLASSPATH_PROVIDER"[^>]*\/>/, '')
        }
    }
}