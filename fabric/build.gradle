import net.fabricmc.loom.task.ManifestModificationAction
import net.fabricmc.loom.task.service.JarManifestService

plugins {
    id 'joid-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    gametestImplementation(files(rootProject.file("libs/joid-tool-testkit-${joid_version}.jar")))
    gametestImplementation("junit:junit:${junit_version}")
    gametestCompileOnly("org.projectlombok:lombok:${lombok_version}")
    gametestAnnotationProcessor("org.projectlombok:lombok:${lombok_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        configureEach {
            if (name == 'clientGameTest') {
                vmArg("-Djoid.snapshot.output=${layout.buildDirectory.dir('snapshots/renders').get().asFile.absolutePath}")
                vmArg("-Djoid.snapshot.references=${rootProject.file('.snapshots/references').absolutePath}")
                vmArg("-Djoid.snapshot.cache=${rootProject.file('.snapshots/cache').absolutePath}")
                if (project.hasProperty('joid.graphicsBackend')) {
                    programArgs('--graphicsBackend', project.property('joid.graphicsBackend').toString())
                }
            }
        }
    }
}

tasks.named('eclipseClasspath') {
    dependsOn('genSources')
}

tasks.named('genEclipseRuns') {
    doLast {
        fileTree(projectDir) { include('*.launch') }.each { launch ->
            launch.text = launch.text
                    .replace('${workspace_loc:' + eclipse.project.name + '}/' + project.name + '\\', '${workspace_loc:' + eclipse.project.name + '}/')
                    .replaceAll(/\s*<stringAttribute key="org\.eclipse\.jdt\.launching\.CLASSPATH_PROVIDER"[^>]*\/>/, '')
        }
    }
}

[devJar, prodJar].each { task ->
    task.configure {
        def manifestService = JarManifestService.get(project)
        usesService(manifestService)
        doLast(new ManifestModificationAction(manifestService, 'official', project.provider { false }, project.provider { [] }))
    }
}
