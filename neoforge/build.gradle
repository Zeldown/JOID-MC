plugins {
    id 'joid-loader'
}

apply plugin: 'net.neoforged.moddev.legacyforge'

legacyForge {
    enable {
        neoForgeVersion = "${minecraft_version}-${neoforge_version}"
    }
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_version
    }
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()}"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            joidClient(it)
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

obfuscation {
    reobfuscate(tasks.named('devJar', Jar), sourceSets.main)
    reobfuscate(tasks.named('prodJar', Jar), sourceSets.main)
}