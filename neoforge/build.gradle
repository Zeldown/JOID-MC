plugins {
    id 'joid-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()}"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            if (project.hasProperty('joid.test')) {
                systemProperty('joid.test', 'true')
                systemProperty('joid.loader', project.name)
                systemProperty('joid.snapshot.output', file('runs/snapshots').absolutePath)
                systemProperty('joid.snapshot.references', rootProject.file('.snapshots/references').absolutePath)
                systemProperty('joid.cache', layout.buildDirectory.dir('joid-cache').get().asFile.absolutePath)
                programArguments.addAll '--width', '1920', '--height', '1080'
                if (project.hasProperty('joid.graphicsBackend')) {
                    programArguments.addAll '--graphicsBackend', project.property('joid.graphicsBackend').toString()
                }
            }
            if (project.hasProperty('joid.showcase')) {
                project.properties.findAll { it.key.startsWith('joid.showcase') }.each { systemProperty(it.key, it.value.toString()) }
                programArguments.addAll '--quickPlaySingleplayer', 'joid-showcase', '--width', '1920', '--height', '1080', '--username', 'JOID'
            }
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    additionalRuntimeClasspath.extendsFrom(embed, joidDemo, clientTest)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('eclipse') {
    dependsOn('neoForgeIdeSync')
    doLast {
        def folders = [':common'].collect { path -> "${mod_id}%%" + project(path).file('bin/main').absolutePath.replace('\\', '\\\\') }
        fileTree('.eclipse/configurations') { include('*.launch') }.each { launch ->
            launch.text = launch.text.replaceAll(/(-Dfml\.modFolders=[^ "]+)/) { all, modFolders -> ([modFolders] + folders).join(File.pathSeparator) }
        }
    }
}